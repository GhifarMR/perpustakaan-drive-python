<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyDrive — simpan file</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0e14;
        --surface: #141924;
        --surface-2: #1b2231;
        --surface-3: #232c40;
        --border: #28324a;
        --text: #e7ebf3;
        --text-muted: #8b95ac;
        --text-dim: #5b6478;
        --cyan: #4fd1c5;
        --cyan-dim: #2c5c58;
        --amber: #f0b429;
        --amber-dim: #4a3a12;
        --red: #f2545b;
        --red-dim: #4a2427;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background:
          radial-gradient(
            1100px 500px at 85% -10%,
            rgba(79, 209, 197, 0.07),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at -10% 110%,
            rgba(240, 180, 41, 0.06),
            transparent 60%
          ),
          var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }
      ::selection {
        background: var(--cyan-dim);
        color: var(--text);
      }
      code,
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      /* ---------- top bar ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(11, 14, 20, 0.85);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(145deg, var(--cyan), #2c8f86);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Mono";
        font-weight: 600;
        color: #08201d;
        font-size: 15px;
        flex-shrink: 0;
      }
      .brand h1 {
        font-family: "Sora";
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand span {
        color: var(--text-dim);
        font-size: 12px;
        font-family: "IBM Plex Mono";
      }

      .search-wrap {
        flex: 1;
        max-width: 420px;
        margin-left: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 12px;
      }
      .search-wrap input {
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-family: "Inter";
        font-size: 13.5px;
        width: 100%;
      }
      .search-wrap input::placeholder {
        color: var(--text-dim);
      }
      .search-wrap svg {
        flex-shrink: 0;
        opacity: 0.5;
      }

      .btn {
        font-family: "Inter";
        font-weight: 600;
        font-size: 13.5px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 15px;
        transition:
          transform 0.12s ease,
          filter 0.12s ease,
          background 0.12s ease;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--cyan);
        color: #062522;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }
      .btn-ghost {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--text);
      }
      .btn-ghost:hover {
        background: var(--surface-3);
      }
      .btn-icon {
        padding: 8px;
      }
      .btn-danger {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      .btn-danger:hover {
        background: var(--red-dim);
        color: #ffd7d9;
        border-color: #5c2b2f;
      }
      .btn-amber {
        background: var(--amber);
        color: #2b1e02;
      }
      .btn-amber:hover {
        filter: brightness(1.08);
      }

      input[type="file"] {
        display: none;
      }

      /* ---------- layout ---------- */
      .layout {
        flex: 1;
        display: flex;
        width: 100%;
      }
      aside {
        width: 220px;
        flex-shrink: 0;
        padding: 20px 14px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .side-label {
        font-family: "IBM Plex Mono";
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        text-transform: uppercase;
        margin: 14px 10px 8px;
      }
      .side-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13.5px;
        font-weight: 500;
        border: 1px solid transparent;
      }
      .side-item:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .side-item.active {
        background: var(--surface-2);
        color: var(--text);
        border-color: var(--border);
      }
      .side-item .count {
        margin-left: auto;
        font-family: "IBM Plex Mono";
        font-size: 11px;
        color: var(--text-dim);
      }
      .side-item svg {
        flex-shrink: 0;
        opacity: 0.85;
        width: 16px;
        height: 16px;
      }

      .storage-box {
        margin-top: auto;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .storage-box .row {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-family: "IBM Plex Mono";
      }
      .storage-bar {
        height: 5px;
        border-radius: 4px;
        background: var(--surface-3);
        overflow: hidden;
      }
      .storage-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--cyan), var(--amber));
        border-radius: 4px;
      }

      main {
        flex: 1;
        padding: 22px 26px 60px;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .main-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .main-head h2 {
        font-family: "Sora";
        font-size: 19px;
        font-weight: 700;
      }
      .main-head .sub {
        color: var(--text-dim);
        font-size: 12.5px;
        font-family: "IBM Plex Mono";
        margin-top: 3px;
      }
      .view-toggle {
        display: flex;
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px;
      }
      .view-toggle button {
        background: none;
        border: none;
        padding: 6px 9px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--text-dim);
      }
      .view-toggle button.active {
        background: var(--surface-3);
        color: var(--text);
      }

      .dropzone {
        border: 1.5px dashed var(--border);
        border-radius: 14px;
        padding: 36px 20px;
        text-align: center;
        margin-bottom: 22px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .dropzone.drag {
        border-color: var(--cyan);
        background: rgba(79, 209, 197, 0.05);
      }
      .dropzone p {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 10px;
      }
      .dropzone .accent {
        color: var(--cyan);
        font-weight: 600;
      }

      /* ---------- grid ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 14px 12px;
        cursor: default;
        position: relative;
        transition:
          border-color 0.15s,
          transform 0.12s;
      }
      .card:hover {
        border-color: var(--surface-3);
      }
      .card .icon-wrap {
        width: 42px;
        height: 42px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        font-family: "IBM Plex Mono";
        font-weight: 600;
        font-size: 11px;
      }
      .card .fname {
        font-size: 13px;
        font-weight: 600;
        word-break: break-word;
        line-height: 1.35;
        margin-bottom: 3px;
      }
      .card .fmeta {
        font-family: "IBM Plex Mono";
        font-size: 10.5px;
        color: var(--text-dim);
      }
      .card .actions {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      .card .actions button {
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text-muted);
        border-radius: 7px;
        padding: 6px 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card .actions button:hover {
        background: var(--surface-3);
        color: var(--text);
      }

      /* ---------- list view ---------- */
      .list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .list-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .list-row:last-child {
        border-bottom: none;
      }
      .list-row:hover {
        background: var(--surface-2);
      }
      .list-row .icon-wrap {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "IBM Plex Mono";
        font-size: 9.5px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .list-row .fname {
        font-size: 13px;
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list-row .fmeta {
        font-family: "IBM Plex Mono";
        font-size: 11px;
        color: var(--text-dim);
        width: 80px;
        flex-shrink: 0;
      }
      .list-row .actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .list-row .actions button {
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text-muted);
        border-radius: 6px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .list-row .actions button:hover {
        background: var(--surface-3);
        color: var(--text);
      }

      .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-dim);
      }
      .empty svg {
        opacity: 0.35;
        margin-bottom: 14px;
      }
      .empty p {
        font-size: 13.5px;
      }

      @media (max-width: 760px) {
        aside {
          display: none;
        }
        .search-wrap {
          display: none;
        }
        header {
          padding: 12px 16px;
        }
        main {
          padding: 16px;
        }
      }

      button:focus-visible,
      .side-item:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark">&gt;_</div>
        <div>
          <h1>PyDrive</h1>
          <span>simpan &amp; unduh file</span>
        </div>
      </div>
      <div class="search-wrap">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="searchInput" type="text" placeholder="Cari file..." />
      </div>
      <label class="btn btn-primary" for="fileInput">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Unggah file
      </label>
      <input id="fileInput" type="file" multiple />
    </header>

    <div class="layout">
      <aside>
        <div class="side-item active" data-filter="all">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
            />
          </svg>
          Semua file <span class="count" id="countAll">0</span>
        </div>
        <div class="side-item" data-filter="py">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
          Python <span class="count" id="countPy">0</span>
        </div>
        <div class="side-item" data-filter="doc">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          Dokumen &amp; teks <span class="count" id="countDoc">0</span>
        </div>
        <div class="side-item" data-filter="other">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
          </svg>
          Lainnya <span class="count" id="countOther">0</span>
        </div>

        <div class="storage-box">
          <div class="row">
            <span>Terpakai</span><span id="storageText">0 KB</span>
          </div>
          <div class="storage-bar">
            <div
              class="storage-bar-fill"
              id="storageFill"
              style="width: 2%"
            ></div>
          </div>
        </div>
      </aside>

      <main>
        <div class="main-head">
          <div>
            <h2 id="viewTitle">Semua file</h2>
            <div class="sub" id="viewSub">0 item</div>
          </div>
          <div class="view-toggle">
            <button id="gridBtn" class="active" title="Tampilan grid">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
              </svg>
            </button>
            <button id="listBtn" title="Tampilan daftar">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <div class="dropzone" id="dropzone">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#8B95AC"
            stroke-width="1.8"
            style="margin: 0 auto; display: block"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <p>
            Seret file ke sini, atau
            <span class="accent">klik Unggah file</span> di atas.<br />File
            otomatis diunduh ke folder
            <code class="mono">Downloads</code> dan tetap tersimpan di daftar
            ini walau halaman di-refresh.
          </p>
        </div>

        <div id="content"></div>
      </main>
    </div>

    <script>
      (function () {
        "use strict";

        // Penyimpanan persisten via IndexedDB, supaya daftar & isi file
        // tetap ada walau halaman di-refresh atau ditutup lalu dibuka lagi.
        const DB_NAME = "pydrive-db";
        const DB_STORE = "files";

        function openDB() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(DB_STORE)) {
                db.createObjectStore(DB_STORE, { keyPath: "id" });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        }
        const dbPromise = openDB().catch((e) => {
          console.error("Gagal membuka IndexedDB:", e);
          return null;
        });

        const TEXT_EXT = [
          "py",
          "txt",
          "md",
          "json",
          "csv",
          "js",
          "html",
          "css",
          "yml",
          "yaml",
          "xml",
          "log",
          "ini",
          "toml",
          "sh",
        ];
        const CODE_ICON = {
          py: { bg: "#1d3b34", fg: "#4FD1C5", label: "PY" },
          js: { bg: "#3a3320", fg: "#F0B429", label: "JS" },
          json: { bg: "#2a2440", fg: "#b39ddb", label: "{ }" },
          md: { bg: "#22314a", fg: "#7fb3ff", label: "MD" },
          txt: { bg: "#232C40", fg: "#8B95AC", label: "TXT" },
          csv: { bg: "#213a2a", fg: "#7fe0a3", label: "CSV" },
          html: { bg: "#3a2420", fg: "#ff9d6c", label: "</>" },
          css: { bg: "#2a2440", fg: "#b39ddb", label: "CSS" },
        };
        const DEFAULT_ICON = { bg: "#232C40", fg: "#8B95AC", label: "FILE" };

        // File bawaan yang disertakan langsung di dalam index.html ini,
        // supaya source code-nya ikut ter-commit ke GitHub dan otomatis
        // muncul di daftar file begitu halaman pertama kali dibuka.
        const SEED_FILES = [
          {
            name: "perpustakaan_cli.py",
            content: `import sqlite3
import os

DB_NAME = "perpustakaan.db"


# ---------------------------------------------------------
# 1. KONEKSI & SETUP DATABASE
# ---------------------------------------------------------
def get_connection():   
    """Membuka koneksi ke database SQLite3."""
    conn = sqlite3.connect(DB_NAME)
    conn.execute("PRAGMA foreign_keys = ON")
    return conn


def setup_database():
    """Membuat tabel 'buku' jika belum ada."""
    conn = get_connection()
    cursor = conn.cursor()
    cursor.execute("""
        CREATE TABLE IF NOT EXISTS buku (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            judul TEXT NOT NULL,
            pengarang TEXT NOT NULL,
            tahun_terbit INTEGER,
            stok INTEGER NOT NULL DEFAULT 0
        )
    """)
    conn.commit()
    conn.close()


# ---------------------------------------------------------
# 2. CREATE - Tambah data buku
# ---------------------------------------------------------
def tambah_buku():

    pengarang = input("Pengarang       : ").strip()

    if judul == "" or pengarang == "":
        print(">> Judul dan Pengarang tidak boleh kosong!")

    tahun_terbit = input_angka("Tahun terbit    : ")

    conn = get_connection()

    cursor.execute(
        "INSERT INTO buku (judul, pengarang, tahun_terbit, stok) VALUES (?, ?, ?, ?)",
        (judul, pengarang, tahun_terbit, stok)
    )
    conn.commit()
    conn.close()
    print(f">> Buku '{judul}' berhasil ditambahkan!")


# ---------------------------------------------------------
# 3. READ - Lihat semua data buku
# ---------------------------------------------------------
def lihat_semua_buku():
    conn = get_connection()
    cursor = conn.cursor()
    cursor.execute("SELECT * FROM buku ORDER BY id ASC")
    data = cursor.fetchall()
    conn.close()

    print("\\n--- DAFTAR SEMUA BUKU ---")
    tampilkan_tabel(data)


# ---------------------------------------------------------
# 4. READ - Cari buku berdasarkan judul/pengarang
# ---------------------------------------------------------
def cari_buku():
    print("\\n--- CARI BUKU ---")
    kata_kunci = input("Masukkan judul/pengarang yang dicari: ").strip()

    conn = get_connection()

        async function seedFiles() {
          for (const seed of SEED_FILES) {
            if (index.some((f) => f.name === seed.name)) continue;
            const ext = extOf(seed.name);
            const id = "seed-" + seed.name.replace(/[^a-zA-Z0-9]/g, "_");
            const record = {
              id,
              name: seed.name,
              ext,
              size: new Blob([seed.content]).size,
              binary: false,
              createdAt: Date.now(),
              content: seed.content,
            };
            try {
              await putFile(record);
              index.push({
                id: record.id,
                name: record.name,
                ext: record.ext,
                size: record.size,
                binary: record.binary,
                createdAt: record.createdAt,
              });
            } catch (e) {
              console.error("Gagal memuat file bawaan:", seed.name, e);
            }
          }
        }

        let index = [];
        let viewMode = "grid";
        let activeFilter = "all";
        let searchTerm = "";

        const $ = (sel) => document.querySelector(sel);
        const contentEl = $("#content");

        function fmtBytes(n) {
          if (n < 1024) return n + " B";
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
          return (n / 1024 / 1024).toFixed(2) + " MB";
        }

        function extOf(name) {
          const parts = name.split(".");
          return parts.length > 1 ? parts.pop().toLowerCase() : "";
        }

        function categoryOf(ext) {
          if (ext === "py") return "py";
          if (
            [
              "txt",
              "md",
              "json",
              "csv",
              "log",
              "yml",
              "yaml",
              "xml",
              "ini",
              "toml",
            ].includes(ext)
          )
            return "doc";
          return "other";
        }

        async function loadIndex() {
          const db = await dbPromise;
          if (!db) {
            index = [];
            return;
          }
          index = await new Promise((resolve) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).getAll();
            req.onsuccess = () => {
              resolve(
                req.result.map((r) => ({
                  id: r.id,
                  name: r.name,
                  ext: r.ext,
                  size: r.size,
                  binary: r.binary,
                  createdAt: r.createdAt,
                })),
              );
            };
            req.onerror = () => resolve([]);
          });
        }

        async function putFile(record) {
          const db = await dbPromise;
          if (!db) throw new Error("IndexedDB tidak tersedia di browser ini.");
          await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            tx.objectStore(DB_STORE).put(record);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
          });
        }

        async function getContent(id) {
          const db = await dbPromise;
          if (!db) return null;
          return new Promise((resolve) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).get(id);
            req.onsuccess = () =>
              resolve(req.result ? req.result.content : null);
            req.onerror = () => resolve(null);
          });
        }

        async function deleteFileRecord(id) {
          const db = await dbPromise;
          if (!db) return;
          await new Promise((resolve) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            tx.objectStore(DB_STORE).delete(id);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        }

        function iconFor(ext) {
          return CODE_ICON[ext] || DEFAULT_ICON;
        }

        function updateCounts() {
          const all = index.length;
          const py = index.filter((f) => f.ext === "py").length;
          const doc = index.filter((f) => categoryOf(f.ext) === "doc").length;
          const other = index.filter(

          $("#countAll").textContent = all;
          $("#countPy").textContent = py;
          $("#countDoc").textContent = doc;
          $("#countOther").textContent = other;

          const totalBytes = index.reduce((s, f) => s + (f.size || 0), 0);
          $("#storageText").textContent = fmtBytes(totalBytes);
          const pct = Math.max(
            2,
            Math.min(100, (totalBytes / (5 * 1024 * 1024)) * 100),
          );
          $("#storageFill").style.width = pct + "%";
        }

        function filteredFiles() {
          let list = index.slice().sort((a, b) => b.createdAt - a.createdAt);
          if (activeFilter === "py") list = list.filter((f) => f.ext === "py");
          else if (activeFilter === "doc")
            list = list.filter((f) => categoryOf(f.ext) === "doc");
          else if (activeFilter === "other")
            list = list.filter(

        </div>

        function rowHtml(f) {
          const ic = iconFor(f.ext);
          return `
      <div class="list-row">
        <div class="icon-wrap" style="background:${ic.bg}; color:${ic.fg};">${ic.label}</div>
        <div class="fname mono">${escapeHtml(f.name)}</div>
        <div class="fmeta">${fmtBytes(f.size)}</div>
        <div class="actions">
          <button data-action="download" data-id="${f.id}" title="Unduh"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          <button data-action="delete" data-id="${f.id}" title="Hapus"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
        </div>
      </div>`;
        }

        function escapeHtml(s) {
          return s.replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }

        function bindCardEvents() {
          contentEl.querySelectorAll("[data-action]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const id = btn.dataset.id;
              const action = btn.dataset.action;
              const file = index.find((f) => f.id === id);
              if (!file) return;
              if (action === "download") doDownload(file);
              else if (action === "delete") doDelete(file);
            });
          });
        }

        function triggerBlobDownload(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

        async function doDownload(file) {
          const raw = await getContent(file.id);
          if (raw === null) {
            alert("Gagal memuat isi file.");
            return;
          }
          let blob;
          if (file.binary) {
            const byteStr = atob(raw);
            const bytes = new Uint8Array(byteStr.length);
            for (let i = 0; i < byteStr.length; i++)
              bytes[i] = byteStr.charCodeAt(i);
            blob = new Blob([bytes]);
          } else {
            blob = new Blob([raw], { type: "text/plain" });
          }
          triggerBlobDownload(blob, file.name);
        }

        async function doDelete(file) {
          if (
            !confirm(
              `Hapus "${file.name}"? Tindakan ini tidak bisa dibatalkan.`,
            )
          )
            return;
          index = index.filter((f) => f.id !== file.id);
          await deleteFileRecord(file.id);
          render();
        }

        // ---------- upload ----------
        function readFile(file) {
          return new Promise((resolve, reject) => {
            const ext = extOf(file.name);
            const isText = TEXT_EXT.includes(ext);
            const reader = new FileReader();
            reader.onload = () => {
              if (isText) {
                resolve({ content: reader.result, binary: false });
              } else {
                const base64 = reader.result.split(",")[1] || "";
                resolve({ content: base64, binary: true });
              }
            };
            reader.onerror = () => reject(reader.error);
            if (isText) reader.readAsText(file);
            else reader.readAsDataURL(file);
          });
        }

        async function handleFiles(fileList) {
          let failCount = 0;
          for (const file of Array.from(fileList)) {
            try {
              const { content, binary } = await readFile(file);
              const id =
                "f" + Date.now() + Math.random().toString(36).slice(2, 8);
              const record = {
                id,
                name: file.name,
                ext: extOf(file.name),
                size: file.size,
                binary,
                createdAt: Date.now(),
                content,
              };
              await putFile(record);
              index.push({
                id: record.id,
                name: record.name,
                ext: record.ext,
                size: record.size,
                binary: record.binary,
                createdAt: record.createdAt,
              });
              triggerBlobDownload(file, file.name);
            } catch (e) {
              failCount++;
              console.error("Gagal mengunggah", file.name, e);
            }
          }
          if (failCount > 0) {
            alert(
              `${failCount} file gagal disimpan. Browser ini mungkin memblokir IndexedDB (contoh: mode private/incognito) — coba buka di jendela normal.`,
            );
          }
          render();
        }
